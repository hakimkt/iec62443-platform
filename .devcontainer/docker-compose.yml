services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    volumes:
      - ../..:/workspace:cached
    command: sleep infinity
    environment:
      DATABASE_URL: postgresql://iec62443:iec62443_dev@postgres:5432/iec62443_platform
      JWT_SECRET: dev-jwt-secret-change-in-production
      JWT_ACCESS_TOKEN_TTL: 15m
      JWT_REFRESH_TOKEN_TTL: 7d
      NODE_ENV: development
      API_PORT: '4000'
      WEB_PORT: '3000'
      LOG_LEVEL: debug
      MFA_ISSUER: IEC62443-Platform
    depends_on:
      postgres:
        condition: service_healthy

  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: iec62443
      POSTGRES_PASSWORD: iec62443_dev
      POSTGRES_DB: iec62443_platform
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U iec62443 -d iec62443_platform']
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
