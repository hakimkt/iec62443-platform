services:
  postgres:
    image: postgres:16-alpine
    container_name: iec62443-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: iec62443
      POSTGRES_PASSWORD: iec62443_dev
      POSTGRES_DB: iec62443_platform
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U iec62443 -d iec62443_platform']
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
