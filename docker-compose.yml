services:
  # --------------------------------------------------
  # Infrastructure Services
  # --------------------------------------------------
  postgres:
    image: postgres:16-alpine
    container_name: iec62443-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: iec62443
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-iec62443_dev}
      POSTGRES_DB: iec62443_platform
    ports:
      - '${POSTGRES_PORT:-5432}:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U iec62443 -d iec62443_platform']
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - iec62443

  # --------------------------------------------------
  # Database Initializer (run once on first deploy)
  # --------------------------------------------------
  db-init:
    image: node:22-alpine
    container_name: iec62443-db-init
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://iec62443:${POSTGRES_PASSWORD:-iec62443_dev}@postgres:5432/iec62443_platform
    working_dir: /app
    volumes:
      - .:/app:ro
    entrypoint: >
      sh -c "
        apk add --no-cache libc6-compat &&
        corepack enable &&
        pnpm install --frozen-lockfile &&
        pnpm --filter @iec62443/database exec -- tsx src/seed/index.ts &&
        echo 'Database initialized successfully!'
      "
    profiles:
      - init
    networks:
      - iec62443

  # --------------------------------------------------
  # Application Services
  # --------------------------------------------------
  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    container_name: iec62443-api
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://iec62443:${POSTGRES_PASSWORD:-iec62443_dev}@postgres:5432/iec62443_platform
      JWT_SECRET: ${JWT_SECRET:-change-me-in-production}
      JWT_ACCESS_TOKEN_TTL: ${JWT_ACCESS_TOKEN_TTL:-15m}
      JWT_REFRESH_TOKEN_TTL: ${JWT_REFRESH_TOKEN_TTL:-7d}
      NODE_ENV: production
      API_PORT: 4000
      LOG_LEVEL: ${LOG_LEVEL:-info}
      MFA_ISSUER: ${MFA_ISSUER:-IEC62443-Platform}
      CORS_ORIGIN: ${CORS_ORIGIN:-}
    ports:
      - '${API_PORT:-4000}:4000'
    healthcheck:
      test: ['CMD-SHELL', 'wget --spider -q http://localhost:4000/health || exit 1']
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    networks:
      - iec62443

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    container_name: iec62443-web
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    environment:
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:4000}
      NODE_ENV: production
      PORT: 3000
    ports:
      - '${WEB_PORT:-3000}:3000'
    healthcheck:
      test: ['CMD-SHELL', 'wget --spider -q http://localhost:3000 || exit 1']
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    networks:
      - iec62443

volumes:
  postgres_data:

networks:
  iec62443:
    driver: bridge
