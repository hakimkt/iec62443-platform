services:
  # --------------------------------------------------
  # Infrastructure Services
  # --------------------------------------------------
  postgres:
    image: postgres:16-alpine
    container_name: iec62443-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: iec62443
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-iec62443_dev}
      POSTGRES_DB: iec62443_platform
    ports:
      - '${POSTGRES_PORT:-5432}:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U iec62443 -d iec62443_platform']
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - iec62443

  redis:
    image: redis:7-alpine
    container_name: iec62443-redis
    restart: unless-stopped
    ports:
      - '${REDIS_PORT:-6379}:6379'
    volumes:
      - redis_data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - iec62443

  minio:
    image: minio/minio:latest
    container_name: iec62443-minio
    restart: unless-stopped
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY:-minioadmin}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_KEY:-minioadmin}
    ports:
      - '${S3_PORT:-9000}:9000'
      - '${MINIO_CONSOLE_PORT:-9001}:9001'
    volumes:
      - minio_data:/data
    command: server /data --console-address ":9001"
    healthcheck:
      test: ['CMD', 'mc', 'ready', 'local']
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - iec62443

  nats:
    image: nats:2-alpine
    container_name: iec62443-nats
    restart: unless-stopped
    ports:
      - '${NATS_PORT:-4222}:4222'
      - '${NATS_MONITORING_PORT:-8222}:8222'
    command: ['--jetstream', '--store_dir', '/data', '--http_port', '8222']
    volumes:
      - nats_data:/data
    healthcheck:
      test: ['CMD', 'wget', '--spider', '-q', 'http://localhost:8222/healthz']
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - iec62443

  opensearch:
    image: opensearchproject/opensearch:2
    container_name: iec62443-opensearch
    restart: unless-stopped
    environment:
      - discovery.type=single-node
      - OPENSEARCH_JAVA_OPTS=-Xms512m -Xmx512m
      - DISABLE_SECURITY_PLUGIN=true
      - bootstrap.memory_lock=true
    ports:
      - '${OPENSEARCH_PORT:-9200}:9200'
    volumes:
      - opensearch_data:/usr/share/opensearch/data
    ulimits:
      memlock:
        soft: -1
        hard: -1
      nofile:
        soft: 65536
        hard: 65536
    healthcheck:
      test: ['CMD-SHELL', 'curl -f http://localhost:9200/_cluster/health || exit 1']
      interval: 15s
      timeout: 10s
      retries: 5
    networks:
      - iec62443

  # --------------------------------------------------
  # Database Initializer (run once on first deploy)
  # --------------------------------------------------
  db-init:
    image: node:22-alpine
    container_name: iec62443-db-init
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://iec62443:${POSTGRES_PASSWORD:-iec62443_dev}@postgres:5432/iec62443_platform
    working_dir: /app
    volumes:
      - .:/app:ro
    entrypoint: >
      sh -c "
        apk add --no-cache libc6-compat &&
        corepack enable &&
        pnpm install --frozen-lockfile &&
        pnpm --filter @iec62443/database exec -- tsx src/seed/index.ts &&
        echo 'Database initialized successfully!'
      "
    profiles:
      - init
    networks:
      - iec62443

  # --------------------------------------------------
  # Application Services
  # --------------------------------------------------
  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    container_name: iec62443-api
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
      nats:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://iec62443:${POSTGRES_PASSWORD:-iec62443_dev}@postgres:5432/iec62443_platform
      REDIS_URL: redis://redis:6379
      S3_ENDPOINT: http://minio:9000
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:-minioadmin}
      S3_SECRET_KEY: ${S3_SECRET_KEY:-minioadmin}
      S3_BUCKET: ${S3_BUCKET:-iec62443-evidence}
      S3_REGION: ${S3_REGION:-us-east-1}
      NATS_URL: nats://nats:4222
      OPENSEARCH_URL: http://opensearch:9200
      JWT_SECRET: wduC/fSKxLEm+e1U4vetFtg7egJB0nr4duDv+wyhlirYPl7a/MzO5hPWUsYINtRo
      JWT_ACCESS_TOKEN_TTL: ${JWT_ACCESS_TOKEN_TTL:-15m}
      JWT_REFRESH_TOKEN_TTL: ${JWT_REFRESH_TOKEN_TTL:-7d}
      NODE_ENV: production
      API_PORT: 4000
      LOG_LEVEL: ${LOG_LEVEL:-info}
      MFA_ISSUER: ${MFA_ISSUER:-IEC62443-Platform}
    ports:
      - '${API_PORT:-4000}:4000'
    healthcheck:
      test: ['CMD-SHELL', 'wget --spider -q http://localhost:4000/health || exit 1']
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    networks:
      - iec62443

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    container_name: iec62443-web
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    environment:
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:4000}
      NODE_ENV: production
      PORT: 3000
    ports:
      - '${WEB_PORT:-3000}:3000'
    healthcheck:
      test: ['CMD-SHELL', 'wget --spider -q http://localhost:3000 || exit 1']
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    networks:
      - iec62443

  worker:
    build:
      context: .
      dockerfile: apps/worker/Dockerfile
    container_name: iec62443-worker
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://iec62443:${POSTGRES_PASSWORD:-iec62443_dev}@postgres:5432/iec62443_platform
      REDIS_URL: redis://redis:6379
      S3_ENDPOINT: http://minio:9000
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:-minioadmin}
      S3_SECRET_KEY: ${S3_SECRET_KEY:-minioadmin}
      S3_BUCKET: ${S3_BUCKET:-iec62443-evidence}
      S3_REGION: ${S3_REGION:-us-east-1}
      NATS_URL: nats://nats:4222
      OPENSEARCH_URL: http://opensearch:9200
      NODE_ENV: production
      LOG_LEVEL: ${LOG_LEVEL:-info}
      PUPPETEER_EXECUTABLE_PATH: /usr/bin/chromium-browser
    networks:
      - iec62443

volumes:
  postgres_data:
  redis_data:
  minio_data:
  nats_data:
  opensearch_data:

networks:
  iec62443:
    driver: bridge
